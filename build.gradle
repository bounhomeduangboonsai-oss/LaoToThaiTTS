plugins {
    id 'com.android.application'
}

android {
    namespace 'com.laothai.tts'
    compileSdk 35

    defaultConfig {
        applicationId 'com.laothai.tts'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}
